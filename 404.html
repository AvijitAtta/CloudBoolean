<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — CloudBoolean Technology</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('cb-theme');
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:100vh; padding:2rem; background: var(--bg); color: var(--text);">
    <span class="eyebrow">404</span>
    <h1 class="mt-3" style="font-size: clamp(2rem, 5vw, 3.5rem);">We can’t find that page</h1>
    <p style="max-width:560px; color: var(--muted);">The page you’re looking for doesn’t exist or has been moved. Let’s get you back on track.</p>
    <a href="/" class="btn btn-primary-grad btn-lg mt-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
  </main>
</body>
</html>
